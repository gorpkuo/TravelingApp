<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>我的旅行</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section id="home" class="view active">
      <h1 class="title">我的旅行</h1>
      <div class="stack">
        <button class="btn btn-3d" data-go="new-trip">開啟新旅程</button>
        <button class="btn btn-3d" data-go="trips">瀏覽旅程</button>
      </div>
    </section>

    <section id="new-trip" class="view">
      <header class="header-row">
        <button class="btn btn-light" data-go="home">返回</button>
        <h2>建立新旅程</h2>
      </header>
      <form id="newTripForm" class="panel form">
        <label>名稱<input name="name" required placeholder="義大利親子旅行"></label>
        <label>國家<input name="country" required placeholder="義大利"></label>
        <label>地區<input name="region" required placeholder="米蘭、威尼斯"></label>
        <label>出發時間<input name="startDate" type="date" required></label>
        <label>回程時間<input name="endDate" type="date" required></label>
        <button class="btn btn-3d" type="submit">確定</button>
      </form>
    </section>

    <section id="trips" class="view">
      <header class="header-row">
        <button class="btn btn-light" data-go="home">返回</button>
        <h2>瀏覽旅程</h2>
      </header>
      <div id="tripList" class="stack"></div>
    </section>

    <section id="trip-main" class="view">
      <header class="header-row">
        <button class="btn btn-light" data-go="trips">返回</button>
        <h2 id="tripMainTitle">旅程主頁</h2>
      </header>
      <div class="grid-2">
        <button class="btn">交通</button>
        <button class="btn">美食</button>
        <button class="btn">待辦</button>
        <button class="btn btn-3d" id="openSchedule">行程</button>
      </div>
    </section>

    <section id="schedule-days" class="view">
      <header class="header-row">
        <button class="btn btn-light" id="backToTripMain">返回</button>
        <h2>行程日期</h2>
      </header>
      <div id="dayList" class="stack"></div>
    </section>

    <section id="day-editor" class="view">
      <header class="header-row">
        <button class="btn btn-light" id="backToDays">返回</button>
        <h2 id="dayEditorTitle">當天行程</h2>
      </header>

      <div class="panel">
        <h3>食</h3>
        <label>早餐<input id="mealBreakfast" placeholder="猶豫中"></label>
        <label>午餐<input id="mealLunch" placeholder="猶豫中"></label>
        <label>晚餐<input id="mealDinner" placeholder="猶豫中"></label>
      </div>

      <div class="panel">
        <h3>景</h3>
        <label>景點名稱<input id="spotName"></label>
        <label>預計時間<input id="spotTime" type="time"></label>
        <label>地址<input id="spotAddress"></label>
        <label>備註<textarea id="spotNote" rows="2"></textarea></label>
        <button class="btn btn-3d" id="confirmSpot" type="button">確認</button>
      </div>

      <div class="panel">
        <h3>行</h3>
        <label>交通工具
          <select id="transportType">
            <option>開車</option>
            <option>地鐵</option>
            <option>火車</option>
            <option>巴士</option>
            <option>走路</option>
            <option>飛機</option>
          </select>
        </label>
        <label>交通備註<textarea id="transportNote" rows="2"></textarea></label>
      </div>

      <div class="panel">
        <h3>備註事項</h3>
        <textarea id="dailyNote" rows="3" placeholder="自由輸入"></textarea>
      </div>

      <button class="btn btn-3d" id="saveDay" type="button">儲存當天行程</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
